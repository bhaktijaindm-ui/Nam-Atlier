<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | NAM Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --bg: #0b0b0b;
      --ivory: #f3eee6;
      --brass: #b8935a;
      --mute: #a89f92;
      --font-jost: 'Jost', -apple-system, sans-serif;
      --font-script: 'Great Vibes', cursive;
    }
    body {
      background: var(--bg);
      color: var(--ivory);
      font-family: var(--font-jost);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    h1 {
      font-size: clamp(64px, 12vw, 140px);
      font-weight: 200;
      letter-spacing: 0.1em;
      color: var(--brass);
      margin-bottom: 12px;
      line-height: 1;
    }
    h2 {
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      color: var(--mute);
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 36px;
    }
    a.btn-return {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #0b0b0b;
      background: var(--ivory);
      padding: 14px 32px;
      border-radius: 99px;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    a.btn-return:hover {
      background: var(--brass);
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Threshold <span style="font-family: var(--font-script); text-transform: none; color: var(--brass);">Uncharted</span></h2>
  <p>The architectural path you requested has moved or dissolved. Return to our curated archive of projects and essays.</p>
  <a href="/portfolio-detail" class="btn-return">Return to 3D Portfolio &rarr;</a>
</body>
</html>
