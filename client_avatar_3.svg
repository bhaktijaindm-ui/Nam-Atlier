<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bgGrad3" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#282622" />
      <stop offset="60%" stop-color="#141311" />
      <stop offset="100%" stop-color="#090807" />
    </radialGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6D0" />
      <stop offset="45%" stop-color="#C6AD83" />
      <stop offset="100%" stop-color="#7D653E" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="80" cy="80" r="78" fill="url(#bgGrad3)" stroke="url(#goldGrad3)" stroke-width="2" />
  
  <!-- Architectural Rings -->
  <circle cx="80" cy="80" r="70" fill="none" stroke="#C6AD83" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.45" />
  <circle cx="80" cy="80" r="62" fill="none" stroke="#C6AD83" stroke-width="0.5" opacity="0.3" />

  <!-- Cardinal Ticks -->
  <line x1="80" y1="6" x2="80" y2="12" stroke="#C6AD83" stroke-width="1.5" />
  <line x1="80" y1="148" x2="80" y2="154" stroke="#C6AD83" stroke-width="1.5" />
  <line x1="6" y1="80" x2="12" y2="80" stroke="#C6AD83" stroke-width="1.5" />
  <line x1="148" y1="80" x2="154" y2="80" stroke="#C6AD83" stroke-width="1.5" />

  <!-- Distinguished Punjab Estate Owner / Traditional Turban Silhouette -->
  <g fill="url(#goldGrad3)" opacity="0.92">
    <!-- Royal Turban Crown -->
    <path d="M57 44 C57 28, 68 23, 80 23 C92 23, 103 28, 103 44 C103 52, 98 56, 80 56 C62 56, 57 52, 57 44 Z" fill="#F7EEDF" />
    <path d="M78 23 L82 23 L81 33 L79 33 Z" fill="#C6AD83" />
    <!-- Face / Trimmed Beard -->
    <path d="M68 53 C68 64, 73 75, 80 75 C87 75, 92 64, 92 53 Z" fill="url(#goldGrad3)" />
    <path d="M68 62 C70 72, 75 75, 80 75 C85 75, 90 72, 92 62 C92 68, 87 77, 80 77 C73 77, 68 68, 68 62 Z" fill="#F2E6D0" />
    <!-- Neck -->
    <path d="M74 74 L86 74 L85 84 L75 84 Z" opacity="0.85" />
    <!-- Regal Sherwani / Bandhgala Collar -->
    <path d="M43 116 C45 96, 58 87, 72 85 L80 90 L88 85 C102 87, 115 96, 117 116 Z" />
    <line x1="80" y1="85" x2="80" y2="116" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Gold Star Bar -->
  <g fill="#C6AD83" font-size="8" text-anchor="middle" letter-spacing="3">
    <text x="82" y="128">★★★★★</text>
  </g>

  <!-- Client Monogram Tag -->
  <rect x="58" y="133" width="44" height="15" rx="7.5" fill="#12100E" stroke="url(#goldGrad3)" stroke-width="1" />
  <text x="80" y="144" fill="#F2E6D0" font-family="'Playfair Display', Georgia, serif" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">HD</text>
</svg>
