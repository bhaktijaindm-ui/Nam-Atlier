<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bgGrad1" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2C261F" />
      <stop offset="60%" stop-color="#161412" />
      <stop offset="100%" stop-color="#0A0908" />
    </radialGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6D0" />
      <stop offset="45%" stop-color="#C6AD83" />
      <stop offset="100%" stop-color="#8C734B" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6AD83" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#C6AD83" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C6AD83" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="80" cy="80" r="78" fill="url(#bgGrad1)" stroke="url(#goldGrad1)" stroke-width="2" />
  
  <!-- Architectural Concentric Rings -->
  <circle cx="80" cy="80" r="70" fill="none" stroke="#C6AD83" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.45" />
  <circle cx="80" cy="80" r="62" fill="none" stroke="#C6AD83" stroke-width="0.5" opacity="0.3" />

  <!-- Cardinal Ticks -->
  <line x1="80" y1="6" x2="80" y2="12" stroke="#C6AD83" stroke-width="1.5" />
  <line x1="80" y1="148" x2="80" y2="154" stroke="#C6AD83" stroke-width="1.5" />
  <line x1="6" y1="80" x2="12" y2="80" stroke="#C6AD83" stroke-width="1.5" />
  <line x1="148" y1="80" x2="154" y2="80" stroke="#C6AD83" stroke-width="1.5" />

  <!-- Refined Male Executive Silhouette -->
  <g fill="url(#goldGrad1)" opacity="0.92">
    <!-- Head -->
    <ellipse cx="80" cy="54" rx="17" ry="21" />
    <!-- Hair / Clean Side Profile Profile -->
    <path d="M63 50 C63 36, 73 31, 80 31 C87 31, 97 36, 97 50 C95 44, 91 38, 80 38 C69 38, 65 44, 63 50 Z" fill="#F5EBD9" />
    <!-- Neck -->
    <path d="M73 73 L87 73 L85 84 L75 84 Z" opacity="0.85" />
    <!-- Shoulders & Bespoke Suit Jacket -->
    <path d="M44 116 C45 96, 58 87, 72 85 L80 95 L88 85 C102 87, 115 96, 116 116 Z" />
    <!-- Shirt Collar & Tie V -->
    <path d="M72 85 L80 97 L88 85 L82 85 L80 89 L78 85 Z" fill="#FFFFFF" opacity="0.9" />
    <polygon points="78,92 82,92 81,108 80,111 79,108" fill="#F2E6D0" />
  </g>

  <!-- Gold Star Bar -->
  <g fill="#C6AD83" font-size="8" text-anchor="middle" letter-spacing="3">
    <text x="82" y="128">★★★★★</text>
  </g>

  <!-- Client Monogram Tag -->
  <rect x="58" y="133" width="44" height="15" rx="7.5" fill="#12100E" stroke="url(#goldGrad1)" stroke-width="1" />
  <text x="80" y="144" fill="#F2E6D0" font-family="'Playfair Display', Georgia, serif" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">VS</text>
</svg>
