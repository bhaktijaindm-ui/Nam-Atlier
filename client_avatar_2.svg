  <!-- Gold Star Bar -->
  <g fill="#D4AF37" font-size="8" text-anchor="middle" letter-spacing="3">
    <text x="82" y="128">★★★★★</text>
  </g>

  <!-- Client Monogram Tag -->
  <rect x="58" y="133" width="44" height="15" rx="7.5" fill="#140F0F" stroke="url(#goldGrad2)" stroke-width="1" />
  <text x="80" y="144" fill="#F7EEDF" font-family="'Playfair Display', Georgia, serif" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">KM</text>
