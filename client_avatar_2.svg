  <circle cx="80" cy="80" r="62" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.3" />

  <!-- Cardinal Ticks -->
  <line x1="80" y1="6" x2="80" y2="12" stroke="#D4AF37" stroke-width="1.5" />
  <line x1="80" y1="148" x2="80" y2="154" stroke="#D4AF37" stroke-width="1.5" />
  <line x1="6" y1="80" x2="12" y2="80" stroke="#D4AF37" stroke-width="1.5" />
  <line x1="148" y1="80" x2="154" y2="80" stroke="#D4AF37" stroke-width="1.5" />

  <!-- Refined Female Silhouette -->
  <g fill="url(#goldGrad2)" opacity="0.92">
    <!-- Hair Volume -->
    <path d="M60 55 C59 34, 72 26, 80 26 C88 26, 101 34, 100 55 C101 68, 97 78, 95 86 C91 80, 89 74, 89 67 C89 55, 87 40, 80 40 C73 40, 71 55, 71 67 C71 74, 69 80, 65 86 C63 78, 59 68, 60 55 Z" fill="#F7EEDF" />
    <!-- Face / Jaw -->
    <path d="M69 54 C69 66, 74 74, 80 74 C86 74, 91 66, 91 54 C91 44, 86 42, 80 42 C74 42, 69 44, 69 54 Z" fill="url(#goldGrad2)" />
