      <stop offset="0%" stop-color="#2D2322" />
      <stop offset="60%" stop-color="#181313" />
      <stop offset="100%" stop-color="#0A0808" />
    </radialGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
